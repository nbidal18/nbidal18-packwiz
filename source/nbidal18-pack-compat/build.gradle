plugins {
    id 'fabric-loom' version '1.14.9'
    id 'maven-publish'
}

def launchGuardSource = layout.projectDirectory.file('../../tools/nbidal18-launch-guard.jar')
def generatedLaunchGuardResources = layout.buildDirectory.dir('generated/launch-guard-resources')

def prepareEmbeddedLaunchGuard = tasks.register('prepareEmbeddedLaunchGuard') {
    inputs.file(launchGuardSource)
    outputs.dir(generatedLaunchGuardResources)

    doLast {
        File source = launchGuardSource.asFile
        if (!source.isFile() || java.nio.file.Files.isSymbolicLink(source.toPath())) {
            throw new GradleException("The reviewed launch guard is missing or unsafe: ${source}")
        }

        java.nio.file.attribute.BasicFileAttributes sourceAttributes = java.nio.file.Files.readAttributes(
            source.toPath(),
            java.nio.file.attribute.BasicFileAttributes,
            java.nio.file.LinkOption.NOFOLLOW_LINKS
        )
        if (!sourceAttributes.isRegularFile() || sourceAttributes.isOther()) {
            throw new GradleException("The reviewed launch guard is not a plain regular file: ${source}")
        }
        if (sourceAttributes.size() <= 0 || sourceAttributes.size() > 16 * 1024 * 1024) {
            throw new GradleException("The reviewed launch guard has an unsafe size: ${sourceAttributes.size()}")
        }

        new java.util.jar.JarFile(source, false).withCloseable { archive ->
            java.util.jar.Attributes attributes = archive.manifest?.mainAttributes
            if (attributes?.getValue('Main-Class') != 'dev.nbidal18.launchguard.LaunchGuard'
                    || attributes?.getValue('Implementation-Title') != 'nbidal18-launch-guard'
                    || archive.getJarEntry('dev/nbidal18/launchguard/LaunchGuard.class') == null) {
                throw new GradleException("The reviewed launch-guard source artifact has an unexpected identity: ${source}")
            }
        }

        java.security.MessageDigest digest = java.security.MessageDigest.getInstance('SHA-256')
        source.withInputStream { input ->
            byte[] buffer = new byte[128 * 1024]
            int read
            while ((read = input.read(buffer)) >= 0) {
                digest.update(buffer, 0, read)
            }
        }
        String sha256 = java.util.HexFormat.of().formatHex(digest.digest())

        File resourceRoot = generatedLaunchGuardResources.get().asFile
        File payloadDirectory = new File(resourceRoot, 'META-INF/nbidal18')
        if (!payloadDirectory.mkdirs() && !payloadDirectory.isDirectory()) {
            throw new GradleException("Could not create generated resource directory: ${payloadDirectory}")
        }
        java.nio.file.Files.copy(
            source.toPath(),
            new File(payloadDirectory, 'nbidal18-launch-guard.jar').toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
        java.nio.file.Files.writeString(
            new File(payloadDirectory, 'launch-guard.tsv').toPath(),
            "nbidal18-launch-guard\t1\nsha256\t${sha256}\nsize\t${sourceAttributes.size()}\n",
            java.nio.charset.StandardCharsets.UTF_8
        )
    }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "maven.modrinth:better-compatibility-checker:${project.bcc_version}"
    modCompileOnly "maven.modrinth:skin-overrides:${project.skin_overrides_version}"
    modCompileOnly "maven.modrinth:autohud:${project.autohud_version}"
    modCompileOnly "maven.modrinth:thermoo:${project.thermoo_version}"
    modCompileOnly "maven.modrinth:immersive-aircraft:${project.immersive_aircraft_version}"
    modCompileOnly "maven.modrinth:immersive-machinery:${project.immersive_machinery_version}"
    modCompileOnly "maven.modrinth:artifacts:${project.artifacts_version}"
    modCompileOnly "maven.modrinth:sodium-extra:${project.sodium_extra_version}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

processResources {
    dependsOn prepareEmbeddedLaunchGuard
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'fabric_loader_version', project.fabric_loader_version
    inputs.property 'fabric_api_version', project.fabric_api_version
    inputs.property 'bcc_version', project.bcc_version
    inputs.property 'skin_overrides_version', project.skin_overrides_version
    inputs.property 'autohud_version', project.autohud_version
    inputs.property 'thermoo_version', project.thermoo_version
    inputs.property 'immersive_aircraft_version', project.immersive_aircraft_version
    inputs.property 'immersive_machinery_version', project.immersive_machinery_version
    inputs.property 'artifacts_version', project.artifacts_version
    inputs.property 'sodium_extra_version', project.sodium_extra_version

    filesMatching('fabric.mod.json') {
        expand(
            version: project.version,
            minecraft_version: project.minecraft_version,
            fabric_loader_version: project.fabric_loader_version,
            fabric_api_version: project.fabric_api_version,
            bcc_version: project.bcc_version,
            skin_overrides_version: project.skin_overrides_version,
            autohud_version: project.autohud_version,
            thermoo_version: project.thermoo_version,
            immersive_aircraft_version: project.immersive_aircraft_version,
            immersive_machinery_version: project.immersive_machinery_version,
            artifacts_version: project.artifacts_version,
            sodium_extra_version: project.sodium_extra_version
        )
    }
}

sourceSets {
    main {
        resources.srcDir(generatedLaunchGuardResources)
    }
}

def verifyRemappedEmbeddedLaunchGuard = tasks.register('verifyRemappedEmbeddedLaunchGuard') {
    doLast {
        File source = launchGuardSource.asFile
        File remapped = tasks.named('remapJar').get().archiveFile.get().asFile
        if (!remapped.isFile()) {
            throw new GradleException("The remapped companion JAR is missing: ${remapped}")
        }

        java.security.MessageDigest sourceDigest = java.security.MessageDigest.getInstance('SHA-256')
        source.withInputStream { input ->
            byte[] buffer = new byte[128 * 1024]
            int read
            while ((read = input.read(buffer)) >= 0) {
                sourceDigest.update(buffer, 0, read)
            }
        }
        String expectedHash = java.util.HexFormat.of().formatHex(sourceDigest.digest())
        String expectedDescriptor = "nbidal18-launch-guard\t1\nsha256\t${expectedHash}\nsize\t${source.length()}\n"

        new java.util.jar.JarFile(remapped, false).withCloseable { archive ->
            List<java.util.jar.JarEntry> payloadEntries = []
            List<java.util.jar.JarEntry> descriptorEntries = []
            java.util.Enumeration<java.util.jar.JarEntry> entries = archive.entries()
            while (entries.hasMoreElements()) {
                java.util.jar.JarEntry entry = entries.nextElement()
                if (entry.name == 'META-INF/nbidal18/nbidal18-launch-guard.jar') {
                    payloadEntries.add(entry)
                } else if (entry.name == 'META-INF/nbidal18/launch-guard.tsv') {
                    descriptorEntries.add(entry)
                }
            }
            if (payloadEntries.size() != 1 || descriptorEntries.size() != 1) {
                throw new GradleException(
                    "The final companion must contain exactly one embedded launch guard and descriptor"
                )
            }

            java.util.jar.JarEntry payloadEntry = payloadEntries.first()
            if (payloadEntry.size != source.length()) {
                throw new GradleException("The final embedded launch-guard size differs from the reviewed source")
            }
            java.security.MessageDigest embeddedDigest = java.security.MessageDigest.getInstance('SHA-256')
            archive.getInputStream(payloadEntry).withCloseable { input ->
                byte[] buffer = new byte[128 * 1024]
                int read
                while ((read = input.read(buffer)) >= 0) {
                    embeddedDigest.update(buffer, 0, read)
                }
            }
            String embeddedHash = java.util.HexFormat.of().formatHex(embeddedDigest.digest())
            if (embeddedHash != expectedHash) {
                throw new GradleException(
                    "The final embedded launch guard differs from the reviewed source: ${embeddedHash}"
                )
            }

            String descriptor = archive.getInputStream(descriptorEntries.first()).withCloseable { input ->
                new String(input.readAllBytes(), java.nio.charset.StandardCharsets.UTF_8)
            }
            if (descriptor != expectedDescriptor) {
                throw new GradleException("The final embedded launch-guard descriptor is stale or malformed")
            }

            String mixinResource = 'nbidal18-pack-compat.client.mixins.json'
            java.util.jar.JarEntry mixinEntry = archive.getJarEntry(mixinResource)
            if (mixinEntry == null) {
                throw new GradleException("The final companion is missing ${mixinResource}")
            }
            Map mixinConfig = archive.getInputStream(mixinEntry).withCloseable { input ->
                (Map) new groovy.json.JsonSlurper().parse(input)
            }
            String mixinPackage = (String) mixinConfig.get('package')
            Set<String> expectedTopLevelMixins = ((List) mixinConfig.get('client'))
                .collect { String name -> name + '.class' }
                .toSet()
            String mixinPrefix = mixinPackage.replace('.', '/') + '/'
            Set<String> actualTopLevelClasses = [] as Set
            archive.entries().each { java.util.jar.JarEntry entry ->
                if (!entry.directory && entry.name.startsWith(mixinPrefix)) {
                    String relative = entry.name.substring(mixinPrefix.length())
                    if (!relative.contains('/') && relative.endsWith('.class') && !relative.contains('$')) {
                        actualTopLevelClasses.add(relative)
                    }
                }
            }
            if (actualTopLevelClasses != expectedTopLevelMixins) {
                throw new GradleException(
                    "The Mixin-owned package must contain only configured mixins; expected " +
                    "${expectedTopLevelMixins.sort()}, found ${actualTopLevelClasses.sort()}"
                )
            }
            if (archive.getJarEntry('dev/nbidal18/packcompat/autohud/AutoHudRenderGate.class') == null
                    || archive.getJarEntry(
                        'dev/nbidal18/packcompat/autohud/mixin/AutoHudRenderGate.class') != null) {
                throw new GradleException(
                    'AutoHudRenderGate must be outside the package reserved for Mixin classes'
                )
            }
        }
    }
}

tasks.named('remapJar') {
    finalizedBy verifyRemappedEmbeddedLaunchGuard
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

java {
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { 'LICENSE_nbidal18_pack_compat' }
    }
    manifest {
        attributes(
            'Implementation-Title': 'nbidal18 Pack Compatibility Enforcer',
            'Implementation-Version': project.version
        )
    }
}
