plugins {
    id 'fabric-loom' version '1.14.9'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "maven.modrinth:better-compatibility-checker:${project.bcc_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'fabric_loader_version', project.fabric_loader_version
    inputs.property 'fabric_api_version', project.fabric_api_version
    inputs.property 'bcc_version', project.bcc_version

    filesMatching('fabric.mod.json') {
        expand(
            version: project.version,
            minecraft_version: project.minecraft_version,
            fabric_loader_version: project.fabric_loader_version,
            fabric_api_version: project.fabric_api_version,
            bcc_version: project.bcc_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

java {
    withSourcesJar()
}

jar {
    from('LICENSE') {
        rename { 'LICENSE_nbidal18_pack_compat' }
    }
    manifest {
        attributes(
            'Implementation-Title': 'nbidal18 Pack Compatibility Enforcer',
            'Implementation-Version': project.version
        )
    }
}
