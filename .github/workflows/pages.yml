name: Deploy Packwiz update site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Packwiz site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          # The strict client manifest and seed templates intentionally live
          # under site/.nbidal18. upload-pages-artifact excludes dot paths by
          # default, so the deployed updater would otherwise fail closed.
          include-hidden-files: true
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
